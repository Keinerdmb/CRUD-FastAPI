[project]
name = "products-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "mateoriwi", email = "sharonmilena.mmm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.46",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
products-api = "products_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

